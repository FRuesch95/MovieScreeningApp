on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  tag:
    runs-on: [self-hosted]

    permissions:
      contents: write

    outputs:
      version: ${{ steps.calver.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate CalVer
        id: calver
        shell: bash
        run: |
          PREFIX="$(date +'%Y.%m')"

          git fetch --tags

          LAST_TAG=$(git tag --list "${PREFIX}.*" \
            | sort -V \
            | tail -n 1)

          if [ -z "$LAST_TAG" ]; then
            VERSION=1
          else
            VERSION=$(echo "$LAST_TAG" | awk -F. '{print $3 + 1}')
          fi

          TAG="${PREFIX}.${VERSION}"

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create git tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          GIT_TAG="${{ steps.calver.outputs.tag }}"

          git tag $GIT_TAG
          git push origin $GIT_TAG

  build-backend:
    runs-on: [self-hosted, docker]

    needs: tag

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: MovieScreeningApp.Api/Dockerfile
          push: true
          tags: ${{ vars.REGISTRY_HOST }}/movie-screening-app/api:${{ needs.tag.outputs.version }}

  build-frontend:
    runs-on: [self-hosted, docker]

    needs: tag

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: MovieScreeningApp.Frontend
          push: true
          tags: ${{ vars.REGISTRY_HOST }}/movie-screening-app/frontend:${{ needs.tag.outputs.version }}
