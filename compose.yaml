services:
  frontend:
    image: moviescreeningapp.frontend
    build:
      context: MovieScreeningApp.Frontend
    depends_on:
      - backend
    labels:
      traefik.enable: true
      traefik.http.routers.movie-screening-frontend.rule: Host(`${HOSTNAME}`) && !PathPrefix(`/api/`)
      traefik.http.routers.movie-screening-frontend.entrypoints: websecure
      traefik.http.routers.movie-screening-frontend.tls: true

  backend:
    image: moviescreeningapp.api
    build:
      context: .
      dockerfile: MovieScreeningApp.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
    labels:
      traefik.enable: true
      traefik.http.routers.movie-screening-backend.rule: Host(`${HOSTNAME}`) && PathPrefix(`/api/`)
      traefik.http.routers.movie-screening-backend.entrypoints: websecure
      traefik.http.routers.movie-screening-backend.tls: true
    environment:
      - ConnectionStrings__DbConnection=Server=database;Database=${MARIADB_DATABASE};User=${MARIADB_USER};Password=${MARIADB_PASSWORD};
      - Admin__Token=${ADMIN_TOKEN}
    volumes:
      - filestore:/app/FileStore

  db:
    hostname: database
    image: mariadb:11
    env_file:
      - .env
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  filestore:
  db:

networks:
  default:
    external: true
    name: traefik_reverse_proxy
